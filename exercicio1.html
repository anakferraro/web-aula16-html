<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Moeda</title>
    <script>
        window.onload = inicio;

        function inicio() {
            let botao = document.getElementById('botao');
            botao.addEventListener('click', envia);
        }

        function envia() {
            let valorReais = document.getElementById('valor_reais').value;
            let saida = document.getElementById('saida');

            if (valorReais === '') {
                saida.innerHTML = 'Por favor, informe um valor em Reais.';
                return;
            }

            // objeto que realiza a conexão e envio
            const xhttp = new XMLHttpRequest();
            xhttp.onload = function () {
                let objetoRecebido = JSON.parse(this.responseText);
                console.log(objetoRecebido);
                saida.innerHTML = 'Valor em dólar: $ ' + objetoRecebido.valor_dolar;
            }
            xhttp.open("GET", "converte.php?valor_reais=" + valorReais, true);
            xhttp.send();
        }
    </script>
</head>

<body>
    <h2>Conversor de Reais para Dólar</h2>
    <label for="valor_reais">Valor em Reais (R$):</label>
    <input type="number" id="valor_reais" placeholder="Ex: 100"><br><br>
    <button id="botao">Converter</button>
    <p id="saida"></p>
</body>

</html>
